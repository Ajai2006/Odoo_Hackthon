<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Payslips — Dayflow HRMS</title>
  <meta name="description" content="View your monthly payslips — earnings, deductions, and net salary breakdown.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./components/ui/design-tokens.css">
  <link rel="stylesheet" href="./components/ui/globals.css">
  <link rel="stylesheet" href="./components/ui/sidebar.css">
  <link rel="stylesheet" href="./components/ui/components.css">
  <style>
    .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--space-8); padding-bottom:var(--space-6); border-bottom:1px solid var(--border); }

    /* Month selector */
    .month-selector {
      display: flex; align-items: center; gap: var(--space-3);
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--radius-btn); padding: var(--space-1);
      box-shadow: var(--shadow-xs);
    }
    .month-btn {
      padding: var(--space-2) var(--space-4); border-radius: 4px;
      font-size: var(--text-sm); font-weight: var(--fw-medium);
      cursor: pointer; transition: all var(--transition-fast);
      background: none; border: none; color: var(--text-secondary);
      white-space: nowrap;
    }
    .month-btn.active { background: var(--primary-700); color: white; box-shadow: var(--shadow-xs); }
    .month-btn:hover:not(.active) { background: var(--bg-muted); color: var(--text-primary); }

    /* Payslip hero */
    .payslip-hero {
      background: linear-gradient(135deg, var(--primary-900) 0%, var(--primary-700) 100%);
      border-radius: var(--radius-card);
      padding: var(--space-8);
      margin-bottom: var(--space-6);
      color: white;
      position: relative;
      overflow: hidden;
    }
    .payslip-hero::before {
      content: '';
      position: absolute; top: -40px; right: -40px;
      width: 200px; height: 200px; border-radius: 50%;
      background: rgba(255,255,255,0.04);
    }
    .payslip-hero::after {
      content: '';
      position: absolute; bottom: -60px; right: 80px;
      width: 150px; height: 150px; border-radius: 50%;
      background: rgba(59,130,246,0.15);
    }
    .payslip-hero-content { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-4); }
    .payslip-hero-left h2 { color: white; margin-bottom: var(--space-1); }
    .payslip-hero-left p  { color: rgba(255,255,255,0.6); font-size: var(--text-sm); }
    .payslip-hero-amount  { text-align: right; }
    .payslip-hero-label   { font-size: var(--text-sm); color: rgba(255,255,255,0.6); margin-bottom: var(--space-1); }
    .payslip-net-amount   { font-size: var(--text-4xl); font-weight: var(--fw-extrabold); font-variant-numeric: tabular-nums; color: white; }

    /* Breakdown section */
    .breakdown-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); margin-bottom: var(--space-6); }

    .breakdown-table { width: 100%; border-collapse: collapse; }
    .breakdown-table th {
      text-align: left; padding: var(--space-2) var(--space-3);
      font-size: var(--text-xs); font-weight: var(--fw-bold); color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.06em;
      border-bottom: 2px solid var(--border);
    }
    .breakdown-table td {
      padding: var(--space-3);
      font-size: var(--text-sm);
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .breakdown-table tr:last-child td { border-bottom: none; }
    .breakdown-table .total-row { background: var(--bg-muted); font-weight: var(--fw-bold); }
    .breakdown-table .total-row td { border-top: 2px solid var(--border); }
    .amount-col { text-align: right; font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; font-weight: var(--fw-semibold); }

    .section-header {
      display: flex; align-items: center; gap: var(--space-2);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-btn) var(--radius-btn) 0 0;
      font-size: var(--text-sm); font-weight: var(--fw-bold);
    }
    .section-header.earnings  { background: var(--success-bg); color: #065f46; }
    .section-header.deductions{ background: var(--danger-bg);  color: #9f1239; }

    /* Net summary bar */
    .net-summary {
      background: linear-gradient(to right, var(--primary-50), var(--bg-surface));
      border: 1px solid var(--primary-100);
      border-radius: var(--radius-card);
      padding: var(--space-6);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: var(--space-4);
    }
    .net-label { font-size: var(--text-sm); color: var(--text-secondary); }
    .net-value { font-size: var(--text-2xl); font-weight: var(--fw-extrabold); color: var(--primary-900); font-variant-numeric: tabular-nums; }
    .net-formula { font-size: var(--text-sm); color: var(--text-secondary); }
    .net-formula span { font-weight: var(--fw-semibold); }

    @media (max-width: 768px) {
      .breakdown-grid { grid-template-columns: 1fr; }
      .payslip-hero-amount { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>

    <main class="main-content" id="main-content">
      <div class="topbar">
        <div>
          <h1>My Payslips</h1>
          <p>View your monthly salary breakdown</p>
        </div>
        <div style="display:flex;align-items:center;gap:var(--space-3);">
          <button class="btn btn-secondary" id="download-btn" onclick="downloadPayslip()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download PDF
          </button>
        </div>
      </div>

      <!-- Month selector -->
      <div style="margin-bottom:var(--space-6);">
        <div class="month-selector" id="month-selector" style="overflow-x:auto;"></div>
      </div>

      <!-- Loading state -->
      <div id="payslip-loading">
        <div class="skeleton" style="height:140px;border-radius:var(--radius-card);margin-bottom:var(--space-6);"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);">
          <div class="skeleton" style="height:220px;border-radius:var(--radius-card);"></div>
          <div class="skeleton" style="height:220px;border-radius:var(--radius-card);"></div>
        </div>
      </div>

      <!-- Payslip content -->
      <div id="payslip-content" style="display:none;">
        <!-- Hero -->
        <div class="payslip-hero" id="payslip-hero">
          <div class="payslip-hero-content">
            <div class="payslip-hero-left">
              <h2 id="hero-month">August 2026</h2>
              <p id="hero-employee">Employee ID · Department</p>
            </div>
            <div class="payslip-hero-amount">
              <div class="payslip-hero-label">Net Pay</div>
              <div class="payslip-net-amount tabular" id="hero-net">₹—</div>
            </div>
          </div>
        </div>

        <!-- Breakdown -->
        <div class="breakdown-grid" id="breakdown-grid"></div>

        <!-- Net summary -->
        <div class="net-summary" id="net-summary"></div>
      </div>

      <!-- No data -->
      <div id="payslip-empty" style="display:none;" class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:48px;height:48px;opacity:0.3;">
          <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
        </svg>
        <h3>No payslip found</h3>
        <p>No salary record for this month. Contact HR if you believe this is an error.</p>
      </div>
    </main>
  </div>

  <div class="toast-container"></div>

  <script type="module">
    import { Sidebar, StatusBadge, showToast, fmtCurrency } from './components/ui/index.js';
    import { DayflowAuth, DayflowDB } from './components/ui/index.js';

    const user = DayflowAuth.requireAuth();
    if (!user) throw new Error('Not authenticated');

    Sidebar({ role: 'employee', activeKey: 'my-payroll', user: { name: user.name, department: user.department } });
    document.querySelector('.main-content').style.marginLeft = 'var(--sidebar-width)';

    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    let allPayroll = [];
    let selectedPayroll = null;

    async function init() {
      await DayflowDB.init();
      allPayroll = await DayflowDB.getPayrollByEmployee(user.employee_id);
      allPayroll.sort((a,b) => b.year - a.year || b.month - a.month);

      buildMonthSelector();

      if (allPayroll.length > 0) {
        selectPayroll(allPayroll[0]);
      } else {
        document.getElementById('payslip-loading').style.display = 'none';
        document.getElementById('payslip-empty').style.display = 'flex';
      }
    }

    function buildMonthSelector() {
      const container = document.getElementById('month-selector');
      container.innerHTML = '';
      allPayroll.forEach((p, i) => {
        const btn = document.createElement('button');
        btn.className = `month-btn ${i === 0 ? 'active' : ''}`;
        btn.textContent = `${MONTHS[p.month-1].slice(0,3)} ${p.year}`;
        btn.dataset.idx = i;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectPayroll(allPayroll[i]);
        });
        container.appendChild(btn);
      });
    }

    function selectPayroll(p) {
      selectedPayroll = p;
      renderPayslip(p);
    }

    function renderPayslip(p) {
      document.getElementById('payslip-loading').style.display = 'none';
      document.getElementById('payslip-content').style.display = 'block';
      document.getElementById('payslip-empty').style.display   = 'none';

      // Hero
      document.getElementById('hero-month').textContent = `${MONTHS[p.month-1]} ${p.year}`;
      document.getElementById('hero-employee').textContent = `${user.employee_id} · ${user.department}`;
      document.getElementById('hero-net').textContent = fmtCurrency(p.net_salary);

      // Earnings table
      const earnings = [
        { label: 'Basic Salary',         amount: p.base_salary },
        { label: 'House Rent Allowance', amount: p.house_allowance },
        { label: 'Medical Allowance',    amount: p.medical_allowance },
        { label: 'Transport Allowance',  amount: p.transport_allowance },
      ];

      const deductions = [
        { label: 'Income Tax (TDS)',   amount: p.tax_deduction },
        { label: 'Provident Fund',     amount: p.provident_fund },
      ];

      const buildTable = (items, total, type) => `
        <div class="card card-flat" style="border:1px solid var(--border);">
          <div class="section-header ${type}">
            ${type === 'earnings'
              ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>'
              : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>'}
            ${type === 'earnings' ? 'Earnings' : 'Deductions'}
          </div>
          <table class="breakdown-table">
            <thead><tr><th>Component</th><th style="text-align:right;">Amount</th></tr></thead>
            <tbody>
              ${items.map(r => `<tr><td>${r.label}</td><td class="amount-col">${fmtCurrency(r.amount)}</td></tr>`).join('')}
              <tr class="total-row">
                <td>Total ${type === 'earnings' ? 'Earnings' : 'Deductions'}</td>
                <td class="amount-col">${fmtCurrency(total)}</td>
              </tr>
            </tbody>
          </table>
        </div>`;

      document.getElementById('breakdown-grid').innerHTML =
        buildTable(earnings, p.gross_salary, 'earnings') +
        buildTable(deductions, p.total_deductions, 'deductions');

      // Net summary
      document.getElementById('net-summary').innerHTML = `
        <div>
          <div class="net-label">Net Salary</div>
          <div class="net-value tabular">${fmtCurrency(p.net_salary)}</div>
        </div>
        <div class="net-formula">
          <span style="color:var(--success);">${fmtCurrency(p.gross_salary)}</span>
          <span style="margin:0 var(--space-2);">Gross</span>
          <span>−</span>
          <span style="color:var(--danger);margin:0 var(--space-2);">${fmtCurrency(p.total_deductions)}</span>
          <span>Deductions</span>
          <span style="margin:0 var(--space-2);">=</span>
          <span style="color:var(--primary-700);font-weight:700;">${fmtCurrency(p.net_salary)}</span>
        </div>
        <div>
          <div class="caption">Generated: ${new Date(p.created_at).toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'})}</div>
        </div>`;
    }

    window.downloadPayslip = function() {
      if (!selectedPayroll) return;
      showToast('PDF download — connect to backend for real PDF generation', 'info');
    };

    init().catch(err => showToast('Error: ' + err.message, 'error'));
  </script>
</body>
</html>
