# ============================================================
# Dayflow HRMS — docker-compose.yml
# Orchestrates: server (Express API) + client (React/nginx)
# ============================================================
version: '3.9'

services:
  # ----------------------------------------------------------
  # Express Backend API
  # ----------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dayflow-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-dayflow_hrms_change_me_in_production}
      DB_PATH: dayflow.db
      CORS_ORIGINS: http://localhost:3000,http://localhost
    volumes:
      # Persist the SQLite database across container restarts
      - dayflow_db:/app/dayflow.db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------
  # React + Vite → nginx Client (SPA)
  # ----------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
    container_name: dayflow-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy

# ----------------------------------------------------------
# Named volumes
# ----------------------------------------------------------
volumes:
  dayflow_db:
    driver: local
