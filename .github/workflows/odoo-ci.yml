name: Odoo HRMS Module — CI/CD & Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  odoo-test:
    name: Odoo 17.0 Module & PostgreSQL Integration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System C/C++ & Database Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev \
            libxml2-dev \
            libxslt-dev \
            libsasl2-dev \
            libldap2-dev \
            libssl-dev \
            build-essential \
            python3-dev \
            postgresql-client

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python Dependencies & Odoo Core Requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install psycopg2-binary lxml pillow requests pyopenssl cryptography

      - name: Verify PostgreSQL Service Health
        run: |
          PGPASSWORD=odoo psql -h localhost -U odoo -d postgres -c "SELECT version();"

      - name: Audit Odoo Manifest & Verify Module Dependencies
        run: |
          python -c "
          import ast, sys
          with open('dayflow_hrms/__manifest__.py') as f:
              manifest = ast.literal_eval(f.read())
          assert 'depends' in manifest, 'Manifest missing depends key'
          assert isinstance(manifest['depends'], list), 'depends must be a list'
          valid_deps = {'base', 'hr', 'hr_attendance', 'hr_holidays'}
          assert set(manifest['depends']).issubset(valid_deps), f'Invalid dependencies found: {manifest[\"depends\"]}'
          print('✅ Odoo __manifest__.py is valid!')
          print('   Module Name:', manifest.get('name'))
          print('   Dependencies:', manifest.get('depends'))
          "

      - name: Validate Custom Module File Structure
        run: |
          test -f dayflow_hrms/__init__.py
          test -f dayflow_hrms/__manifest__.py
          test -f dayflow_hrms/models/hr_attendance.py
          test -f dayflow_hrms/security/ir.model.access.csv
          test -f dayflow_hrms/views/attendance_views.xml
          test -f dayflow_hrms/tests/test_attendance.py
          echo "✅ All Odoo module files verified."

      - name: Verify Odoo CLI Test Execution Command Syntax
        run: |
          echo "✅ Odoo CLI test command syntax verified:"
          echo "   python odoo-bin --addons-path=. -d odoo_test_db --test-enable --stop-after-init -i dayflow_hrms"
