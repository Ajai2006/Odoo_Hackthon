<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employees — Dayflow HRMS</title>
  <meta name="description" content="Manage all employees — view profiles, departments, and status.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./components/ui/design-tokens.css">
  <link rel="stylesheet" href="./components/ui/globals.css">
  <link rel="stylesheet" href="./components/ui/sidebar.css">
  <link rel="stylesheet" href="./components/ui/components.css">
  <style>
    .topbar { display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-8);padding-bottom:var(--space-6);border-bottom:1px solid var(--border); }
    .emp-profile-modal { display:flex;flex-direction:column;gap:var(--space-4); }
    .emp-profile-header { display:flex;align-items:center;gap:var(--space-4);padding:var(--space-4);background:var(--bg-muted);border-radius:var(--radius-input); }
    .emp-detail-grid { display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3); }
    .emp-detail-item label { font-size:var(--text-xs);font-weight:var(--fw-bold);color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.06em; }
    .emp-detail-item p { font-size:var(--text-sm);font-weight:var(--fw-medium);color:var(--text-primary);margin-top:2px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <main class="main-content" id="main-content">
      <div class="topbar">
        <div><h1>Employees</h1><p>All staff records and profiles</p></div>
      </div>
      <div class="grid-cols-4" style="margin-bottom:var(--space-6);" id="emp-stats"></div>
      <div id="emp-table-mount"></div>
    </main>
  </div>
  <div id="profile-modal-mount"></div>
  <div class="toast-container"></div>

  <script type="module">
    import { Sidebar, DataTable, Modal, StatusBadge, StatCard, showToast, Icons, el, escHtml } from './components/ui/index.js';
    import { DayflowAuth, DayflowDB } from './components/ui/index.js';

    const user = DayflowAuth.requireRole('admin');
    if (!user) throw new Error('Admin only');
    Sidebar({ role: 'admin', activeKey: 'employees', user: { name: user.name } });
    document.querySelector('.main-content').style.marginLeft = 'var(--sidebar-width)';

    const profileContent = document.createElement('div');
    const profileModal = Modal({ title: 'Employee Profile', size: 'lg', children: profileContent });

    async function init() {
      await DayflowDB.init();
      const employees = await DayflowDB.getEmployees();
      const todayAtt  = await DayflowDB.getAllTodayAttendance();

      // Stat cards
      const statsEl = document.getElementById('emp-stats');
      statsEl.innerHTML = '';
      const active = employees.filter(e => e.status === 'active').length;
      const depts  = new Set(employees.map(e => e.department)).size;
      const present = todayAtt.filter(a => a.status === 'present' || a.status === 'late').length;
      [
        { title: 'Total Employees',   value: employees.length, icon: 'users',      color: 'primary'  },
        { title: 'Active',            value: active,           icon: 'check',      color: 'success'  },
        { title: 'Present Today',     value: present,          icon: 'attendance', color: 'info'     },
        { title: 'Departments',       value: depts,            icon: 'dashboard',  color: 'warning'  },
      ].forEach((s,i) => {
        const c = StatCard(s); c.style.animationDelay = `${i*0.07}s`;
        statsEl.appendChild(c);
      });

      // Table
      const tableData = employees.map(emp => ({
        ...emp,
        avatar: emp.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(),
        today: (todayAtt.find(a=>a.employee_id===emp.employee_id) || {}).status || 'absent'
      }));

      const mount = document.getElementById('emp-table-mount');
      mount.innerHTML = '';
      const table = DataTable({
        columns: [
          { key:'name', label:'Employee', sortable:true, render:(v,r) => {
            const d = document.createElement('div'); d.style.cssText='display:flex;align-items:center;gap:10px;';
            d.innerHTML=`<div class="avatar" style="width:32px;height:32px;font-size:11px;">${r.avatar}</div><div><div style="font-weight:600;font-size:var(--text-sm);">${escHtml(v)}</div><div style="font-size:var(--text-xs);color:var(--text-secondary);">${escHtml(r.employee_id)}</div></div>`; return d; }},
          { key:'department',  label:'Department',  sortable:true },
          { key:'designation', label:'Designation', sortable:true },
          { key:'status', label:'Status', sortable:true, render:(v)=>StatusBadge({status:v}) },
          { key:'today',  label:'Today',            render:(v)=>StatusBadge({status:v,size:'sm'}) },
          { key:'joining_date', label:'Joined', sortable:true, render:(v)=>new Date(v).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) },
        ],
        data: tableData, pageSize: 8,
        onRowClick: (row) => openProfile(row),
      });
      mount.appendChild(table.element);
    }

    function openProfile(emp) {
      profileModal.setTitle(`${emp.name} — ${emp.employee_id}`);
      profileContent.innerHTML = `
        <div class="emp-profile-header">
          <div class="avatar avatar-xl">${emp.avatar}</div>
          <div>
            <h3 style="margin-bottom:4px;">${escHtml(emp.name)}</h3>
            <p style="margin:0;color:var(--text-secondary);">${escHtml(emp.designation)}</p>
            <div style="margin-top:8px;">${StatusBadge({status:emp.status}).outerHTML}</div>
          </div>
        </div>
        <div class="emp-detail-grid">
          <div class="emp-detail-item"><label>Employee ID</label><p>${escHtml(emp.employee_id)}</p></div>
          <div class="emp-detail-item"><label>Department</label><p>${escHtml(emp.department)}</p></div>
          <div class="emp-detail-item"><label>Email</label><p>${escHtml(emp.email)}</p></div>
          <div class="emp-detail-item"><label>Phone</label><p>${escHtml(emp.phone||'—')}</p></div>
          <div class="emp-detail-item"><label>Joining Date</label><p>${new Date(emp.joining_date).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'})}</p></div>
          <div class="emp-detail-item"><label>Leave Balance</label><p>${emp.leave_balance||0} days</p></div>
        </div>
        <div style="display:flex;gap:var(--space-3);margin-top:var(--space-2);">
          <a href="admin-payroll.html#${emp.employee_id}" class="btn btn-primary btn-sm">${Icons.payroll}<span>View Payroll</span></a>
          <a href="attendance.html#${emp.employee_id}"    class="btn btn-secondary btn-sm">${Icons.attendance}<span>Attendance</span></a>
        </div>`;
      profileModal.open();
    }

    init().catch(err => showToast('Error: ' + err.message, 'error'));
  </script>
</body>
</html>
