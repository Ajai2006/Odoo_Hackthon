<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dayflow HRMS — Login</title>
  <meta name="description" content="Dayflow HRMS — Every workday, perfectly aligned. Sign in to access your HR portal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./components/ui/design-tokens.css">
  <link rel="stylesheet" href="./components/ui/globals.css">
  <style>
    body { background: var(--primary-900); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: var(--space-4); }

    .login-bg {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(59,130,246,0.15) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 20%, rgba(6,182,212,0.1) 0%, transparent 50%),
                  var(--primary-900);
      z-index: 0;
    }

    /* Animated grid pattern */
    .login-bg::before {
      content: '';
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .login-card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-modal);
      padding: var(--space-12) var(--space-8);
      width: 100%; max-width: 440px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      animation: slideUp 0.5s ease;
    }

    .login-logo {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--primary-500), var(--info));
      border-radius: var(--radius-card);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto var(--space-6);
      box-shadow: 0 8px 24px rgba(59,130,246,0.4);
    }

    .login-logo svg { width: 28px; height: 28px; color: white; }

    .login-brand { text-align: center; margin-bottom: var(--space-8); }
    .login-brand h1 { color: white; font-size: var(--text-3xl); margin-bottom: var(--space-2); }
    .login-brand p  { color: rgba(255,255,255,0.5); font-size: var(--text-sm); }

    .role-selector {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
      margin-bottom: var(--space-6);
    }

    .role-card {
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-card);
      padding: var(--space-4);
      cursor: pointer;
      transition: all var(--transition-normal);
      text-align: center;
    }

    .role-card:hover {
      background: rgba(59,130,246,0.1);
      border-color: rgba(59,130,246,0.4);
      transform: translateY(-2px);
    }

    .role-card.selected {
      background: rgba(59,130,246,0.15);
      border-color: var(--primary-500);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }

    .role-card-icon {
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.08);
      border-radius: var(--radius-input);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto var(--space-2);
      color: var(--primary-400);
    }

    .role-card-icon svg { width: 22px; height: 22px; }
    .role-card-name { font-size: var(--text-sm); font-weight: var(--fw-semibold); color: white; }
    .role-card-desc { font-size: var(--text-xs); color: rgba(255,255,255,0.4); margin-top: 2px; }

    .login-form { display: flex; flex-direction: column; gap: var(--space-4); }

    .login-input {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-input);
      color: white;
      font-size: var(--text-sm);
      font-family: var(--font-sans);
      outline: none;
      transition: all var(--transition-fast);
    }

    .login-input::placeholder { color: rgba(255,255,255,0.3); }
    .login-input:focus { border-color: var(--primary-500); box-shadow: var(--shadow-glow); }

    .login-btn {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      background: linear-gradient(135deg, var(--primary-600), var(--primary-500));
      color: white;
      font-size: var(--text-base);
      font-weight: var(--fw-semibold);
      border-radius: var(--radius-btn);
      border: none;
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: 0 4px 12px rgba(59,130,246,0.4);
      display: flex; align-items: center; justify-content: center; gap: var(--space-2);
    }

    .login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,0.5); }
    .login-btn:active { transform: translateY(0); }

    .login-demo-note {
      text-align: center;
      font-size: var(--text-xs);
      color: rgba(255,255,255,0.35);
      margin-top: var(--space-4);
      padding: var(--space-3);
      background: rgba(255,255,255,0.04);
      border-radius: var(--radius-btn);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .login-label {
      font-size: var(--text-xs);
      font-weight: var(--fw-semibold);
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: -var(--space-2);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-6px); }
    }
    .login-logo { animation: float 4s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="login-bg"></div>

  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>

    <div class="login-brand">
      <h1>Dayflow</h1>
      <p>Every workday, perfectly aligned.</p>
    </div>

    <div style="margin-bottom:var(--space-3);">
      <div class="login-label">Sign in as</div>
    </div>

    <div class="role-selector">
      <div class="role-card selected" id="role-admin" onclick="selectRole('admin')">
        <div class="role-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div class="role-card-name">Admin</div>
        <div class="role-card-desc">HR Manager</div>
      </div>
      <div class="role-card" id="role-employee" onclick="selectRole('employee')">
        <div class="role-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="role-card-name">Employee</div>
        <div class="role-card-desc">Staff Member</div>
      </div>
    </div>

    <div class="login-form">
      <div>
        <div class="login-label" style="margin-bottom:var(--space-2);">Email</div>
        <input id="login-email" class="login-input" type="email" placeholder="you@dayflow.io" value="arjun@dayflow.io">
      </div>
      <div>
        <div class="login-label" style="margin-bottom:var(--space-2);">Password</div>
        <input id="login-password" class="login-input" type="password" placeholder="••••••••" value="demo1234">
      </div>

      <button class="login-btn" id="login-btn" onclick="handleLogin()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:16px;height:16px;"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign In
      </button>
    </div>

    <div class="login-demo-note">
      🎯 <strong>Hackathon Demo</strong> — Pre-filled credentials. Select a role above and click Sign In.
    </div>
  </div>

  <script>
    let selectedRole = 'admin';

    function selectRole(role) {
      selectedRole = role;
      document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
      document.getElementById('role-' + role).classList.add('selected');

      const emailMap = { admin: 'arjun@dayflow.io', employee: 'priya@dayflow.io' };
      document.getElementById('login-email').value = emailMap[role];
    }

    function handleLogin() {
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      // Simulate auth
      setTimeout(() => {
        const auth = { admin: 'admin', employee: 'employee' };
        const roleKey = auth[selectedRole];

        const user = {
          admin:    { id: 'admin_001', employee_id: null, name: 'Arjun Sharma', role: 'admin', department: 'HR', email: 'arjun@dayflow.io' },
          employee: { id: 'emp_001', employee_id: 'EMP001', name: 'Priya Nair', role: 'employee', department: 'Engineering', email: 'priya@dayflow.io' }
        };

        sessionStorage.setItem('df_user', JSON.stringify(user[roleKey]));

        const redirectMap = { admin: 'admin-dashboard.html', employee: 'dashboard.html' };
        window.location.href = redirectMap[roleKey];
      }, 800);
    }

    // Enter key support
    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    // Check if already logged in
    const existing = sessionStorage.getItem('df_user');
    if (existing) {
      const u = JSON.parse(existing);
      window.location.href = u.role === 'admin' ? 'admin-dashboard.html' : 'dashboard.html';
    }
  </script>
</body>
</html>
