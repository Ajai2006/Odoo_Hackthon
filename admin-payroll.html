<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payroll Management — Dayflow HRMS</title>
  <meta name="description" content="Dayflow HRMS Admin Payroll Table — salary structure editing, live previews, and mandatory audit comments.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./components/ui/design-tokens.css">
  <link rel="stylesheet" href="./components/ui/globals.css">
  <link rel="stylesheet" href="./components/ui/sidebar.css">
  <link rel="stylesheet" href="./components/ui/components.css">
  <style>
    /* Salary Edit Form Grid */
    .salary-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
    }

    .form-section-title {
      font-size: var(--text-xs);
      font-weight: var(--fw-bold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--border);
      grid-column: 1 / -1;
      margin-top: var(--space-2);
    }
    .form-section-title.earnings   { color: #065f46; border-color: var(--success-bg); }
    .form-section-title.deductions { color: #9f1239; border-color: var(--danger-bg);  }

    /* Live Preview Bar inside Modal */
    .live-preview-box {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      padding: var(--space-4);
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: var(--space-3);
      text-align: center;
      margin-top: var(--space-2);
    }
    .preview-item-label { font-size: var(--text-xs); color: var(--text-secondary); font-weight: var(--fw-semibold); text-transform: uppercase; letter-spacing: 0.05em; }
    .preview-item-val   { font-size: var(--text-xl); font-weight: var(--fw-extrabold); font-variant-numeric: tabular-nums; margin-top: 2px; }

    /* Audit Entry Card */
    .audit-card {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      padding: var(--space-3) var(--space-4);
      margin-bottom: var(--space-3);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>

    <main class="main-content" id="main-content">
      <!-- TopBar Header -->
      <div id="topbar-mount"></div>

      <!-- Stat Cards Summary -->
      <div class="grid-cols-3" style="margin-bottom:var(--space-6);">
        <div class="stat-card animate-slideUp" data-color="primary">
          <div class="stat-card-header">
            <span class="stat-card-title">Total Payroll Expense</span>
            <div class="stat-card-icon">${Icons.dollar}</div>
          </div>
          <div class="stat-card-value tabular" id="total-expense-val">₹—</div>
          <div class="caption">Current month gross commitment</div>
        </div>

        <div class="stat-card animate-slideUp" data-color="success" style="animation-delay:0.06s;">
          <div class="stat-card-header">
            <span class="stat-card-title">Employees Processed</span>
            <div class="stat-card-icon">${Icons.check}</div>
          </div>
          <div class="stat-card-value tabular" id="processed-count-val">—</div>
          <div class="caption">100% ready for disbursement</div>
        </div>

        <div class="stat-card animate-slideUp" data-color="info" style="animation-delay:0.12s;">
          <div class="stat-card-header">
            <span class="stat-card-title">Average Take-Home</span>
            <div class="stat-card-icon">${Icons.percent}</div>
          </div>
          <div class="stat-card-value tabular" id="avg-takehome-val">₹—</div>
          <div class="caption">Net salary per employee</div>
        </div>
      </div>

      <!-- Main Payroll Table Section -->
      <div class="card card-flat" style="border:1px solid var(--border);padding:var(--space-6);">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4);flex-wrap:wrap;gap:var(--space-3);">
          <div>
            <h3>Employee Salary Master</h3>
            <p class="caption">Click any employee row to edit salary structure and record audit reasons</p>
          </div>
          <div style="display:flex;align-items:center;gap:var(--space-3);">
            <select class="form-select" id="pay-period-select" style="width:auto;" onchange="loadPayrollData()">
              <option value="8-2026">August 2026</option>
              <option value="7-2026">July 2026</option>
            </select>
            <button class="btn btn-secondary" onclick="exportCSV()">
              ${Icons.download}<span>Export CSV</span>
            </button>
          </div>
        </div>

        <div id="payroll-table-mount"></div>
      </div>
    </main>
  </div>

  <!-- Edit Salary Modal -->
  <div id="edit-modal-mount"></div>

  <!-- Audit Modal -->
  <div id="audit-modal-mount"></div>

  <div class="toast-container"></div>

  <script type="module">
    import { Sidebar, TopBar, DataTable, Modal, StatusBadge, showToast, Icons, el, fmtCurrency, attachBlurValidation, escHtml } from './components/ui/index.js';
    import { DayflowAuth, DayflowDB } from './components/ui/index.js';

    // Auth Guard
    const user = DayflowAuth.requireRole('admin');
    if (!user) throw new Error('Admin role required');

    // Sidebar
    Sidebar({ role: 'admin', activeKey: 'admin-payroll', user: { name: user.name } });
    document.querySelector('.main-content').style.marginLeft = 'var(--sidebar-width)';

    // TopBar Header
    const topbar = TopBar({
      title: 'Payroll Administration',
      subtitle: 'Manage salary structures, deductions, and audit history',
      user: { name: user.name, role: 'admin' },
      searchPlaceholder: 'Search employee name, department, ID...'
    });
    document.getElementById('topbar-mount').appendChild(topbar);

    let allEmployees = [];
    let currentPayroll = [];
    let editModal, auditModal;
    const editForm = document.createElement('div');
    const auditContent = document.createElement('div');

    // Modal initializations
    editModal = Modal({
      title: 'Edit Salary Structure',
      size: 'lg',
      children: editForm,
      footerButtons: [
        (() => { const b=el('button',{class:'btn btn-secondary',onclick:()=>editModal.close()});b.textContent='Cancel';return b; })(),
        (() => { const b=el('button',{class:'btn btn-primary',id:'save-salary-btn',onclick:()=>saveSalaryStructure()});b.innerHTML=Icons.check+'<span>Save & Log Comment</span>';return b; })(),
      ]
    });

    auditModal = Modal({ title: 'Salary Change Audit Log', size: 'lg', children: auditContent });

    async function init() {
      await DayflowDB.init();
      allEmployees = await DayflowDB.getEmployees();
      await loadPayrollData();
    }

    window.loadPayrollData = async function() {
      const [month, year] = document.getElementById('pay-period-select').value.split('-').map(Number);
      const records = await DayflowDB.getAllPayroll();
      currentPayroll = records.filter(p => p.month === month && p.year === year);

      const totalExp = currentPayroll.reduce((s, p) => s + p.gross_salary, 0);
      const totalNet = currentPayroll.reduce((s, p) => s + p.net_salary, 0);
      const avgNet   = currentPayroll.length ? Math.round(totalNet / currentPayroll.length) : 0;

      document.getElementById('total-expense-val').textContent  = fmtCurrency(totalExp);
      document.getElementById('processed-count-val').textContent = `${currentPayroll.length} / ${allEmployees.length}`;
      document.getElementById('avg-takehome-val').textContent   = fmtCurrency(avgNet);

      const tableData = currentPayroll.map(p => {
        const emp = allEmployees.find(e => e.employee_id === p.employee_id) || {};
        return {
          ...p,
          emp_name:    emp.name || p.employee_id,
          department:  emp.department || '—',
          designation: emp.designation || '—',
          avatar:      (emp.name || 'U').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()
        };
      });

      const mount = document.getElementById('payroll-table-mount');
      mount.innerHTML = '';

      const table = DataTable({
        columns: [
          {
            key: 'emp_name', label: 'Employee', sortable: true,
            render: (val, row) => {
              const div = document.createElement('div');
              div.style.cssText = 'display:flex;align-items:center;gap:10px;';
              div.innerHTML = `<div class="avatar" style="width:32px;height:32px;font-size:11px;">${row.avatar}</div>
                <div><div style="font-weight:600;font-size:var(--text-sm);">${escHtml(val)}</div><div style="font-size:var(--text-xs);color:var(--text-secondary);">${escHtml(row.employee_id)}</div></div>`;
              return div;
            }
          },
          { key: 'department', label: 'Department', sortable: true },
          { key: 'base_salary',  label: 'Basic Salary', sortable: true, render: (v) => `<span class="tabular">${fmtCurrency(v)}</span>` },
          { key: 'gross_salary', label: 'Gross Salary', sortable: true, render: (v) => `<span class="tabular">${fmtCurrency(v)}</span>` },
          { key: 'total_deductions', label: 'Deductions', sortable: true, render: (v) => `<span class="tabular" style="color:var(--danger);">−${fmtCurrency(v)}</span>` },
          { key: 'net_salary', label: 'Net Take-Home', sortable: true, render: (v) => `<span class="tabular" style="font-weight:700;color:var(--primary-700);">${fmtCurrency(v)}</span>` },
        ],
        data: tableData,
        pageSize: 8,
        onRowClick: (row) => openEditModal(row),
        actions: (row) => {
          const editBtn = el('button', { class: 'btn btn-secondary btn-sm' }, Icons.edit + '<span>Edit</span>');
          editBtn.onclick = (e) => { e.stopPropagation(); openEditModal(row); };

          const auditBtn = el('button', { class: 'btn btn-ghost btn-sm' }, Icons.activity);
          auditBtn.title = 'View Audit Trail';
          auditBtn.onclick = (e) => { e.stopPropagation(); openAuditModal(row); };

          return [editBtn, auditBtn];
        }
      });

      mount.appendChild(table.element);
    };

    function openEditModal(row) {
      editModal.setTitle(`Edit Salary Structure — ${row.emp_name}`);
      editForm.dataset.recordId = row.id;
      editForm.dataset.empName  = row.emp_name;

      editForm.innerHTML = `
        <div class="salary-form-grid">
          <div class="form-section-title earnings">💰 Earnings Components</div>

          <div class="form-group">
            <label class="form-label" for="f-base">Basic Salary (₹) *</label>
            <input class="form-input tabular" id="f-base" type="number" min="0" value="${row.base_salary}">
          </div>

          <div class="form-group">
            <label class="form-label" for="f-hra">House Rent Allowance (HRA) (₹)</label>
            <input class="form-input tabular" id="f-hra" type="number" min="0" value="${row.house_allowance}">
          </div>

          <div class="form-group">
            <label class="form-label" for="f-med">Medical Allowance (₹)</label>
            <input class="form-input tabular" id="f-med" type="number" min="0" value="${row.medical_allowance}">
          </div>

          <div class="form-group">
            <label class="form-label" for="f-trans">Transport Allowance (₹)</label>
            <input class="form-input tabular" id="f-trans" type="number" min="0" value="${row.transport_allowance}">
          </div>

          <div class="form-section-title deductions">📉 Deduction Components</div>

          <div class="form-group">
            <label class="form-label" for="f-tax">Income Tax (TDS) (₹)</label>
            <input class="form-input tabular" id="f-tax" type="number" min="0" value="${row.tax_deduction}">
          </div>

          <div class="form-group">
            <label class="form-label" for="f-pf">Provident Fund (PF) (₹)</label>
            <input class="form-input tabular" id="f-pf" type="number" min="0" value="${row.provident_fund}">
          </div>

          <!-- Live Calculated Preview Box -->
          <div class="live-preview-box">
            <div>
              <div class="preview-item-label">Gross Salary</div>
              <div class="preview-item-val" style="color:var(--success);" id="p-gross">₹0</div>
            </div>
            <div>
              <div class="preview-item-label">Total Deductions</div>
              <div class="preview-item-val" style="color:var(--danger);" id="p-deduct">₹0</div>
            </div>
            <div>
              <div class="preview-item-label">Net Take-Home</div>
              <div class="preview-item-val" style="color:var(--primary-700);" id="p-net">₹0</div>
            </div>
          </div>

          <div class="form-section-title" style="grid-column:1/-1;">📝 Mandatory Audit Reason</div>

          <div class="form-group" style="grid-column:1/-1;">
            <label class="form-label" for="f-reason">Comment / Reason for Change *</label>
            <textarea class="form-input form-textarea" id="f-reason" rows="3" placeholder="e.g. Approved Annual Appraisal Revision — Q3 2026"></textarea>
            <div class="caption" style="margin-top:2px;">Required: Reason is logged for HR audit compliance.</div>
          </div>
        </div>`;

      // Live Calculation Handlers
      const inputs = ['f-base','f-hra','f-med','f-trans','f-tax','f-pf'].map(id => document.getElementById(id));
      const recalc = () => {
        const getV = (id) => Math.max(0, parseFloat(document.getElementById(id)?.value || 0));
        const gross  = getV('f-base') + getV('f-hra') + getV('f-med') + getV('f-trans');
        const deduct = getV('f-tax') + getV('f-pf');
        const net    = gross - deduct;

        document.getElementById('p-gross').textContent  = fmtCurrency(gross);
        document.getElementById('p-deduct').textContent = fmtCurrency(deduct);
        document.getElementById('p-net').textContent    = fmtCurrency(Math.max(0, net));
      };

      inputs.forEach(inp => inp.addEventListener('input', recalc));
      recalc();

      // Attach inline blur validation per prompt spec!
      inputs.forEach(inp => attachBlurValidation(inp, 'Value must be non-negative', val => val !== '' && Number(val) >= 0));
      attachBlurValidation(document.getElementById('f-reason'), 'Audit reason comment is required to save');

      editModal.open();
    }

    async function saveSalaryStructure() {
      const recordId = parseInt(editForm.dataset.recordId);
      const reason   = document.getElementById('f-reason').value.trim();

      if (!reason) {
        document.getElementById('f-reason').classList.add('error');
        showToast('Audit comment is required before saving salary changes.', 'error');
        return;
      }

      const getV = (id) => Math.max(0, parseFloat(document.getElementById(id).value || 0));
      const updates = {
        base_salary:        getV('f-base'),
        house_allowance:    getV('f-hra'),
        medical_allowance:  getV('f-med'),
        transport_allowance:getV('f-trans'),
        tax_deduction:      getV('f-tax'),
        provident_fund:     getV('f-pf'),
      };

      try {
        await DayflowDB.updatePayrollWithAudit(recordId, updates, {
          reason,
          updatedBy: user.name
        });

        showToast(`Updated salary for ${editForm.dataset.empName}`, 'success');
        editModal.close();
        await loadPayrollData();
      } catch (err) {
        showToast('Save failed: ' + err.message, 'error');
      }
    }

    async function openAuditModal(row) {
      auditModal.setTitle(`Salary Audit Trail — ${row.emp_name}`);
      auditContent.innerHTML = '<div class="skeleton" style="height:140px;"></div>';
      auditModal.open();

      const logs = await DayflowDB.getAuditLog('payroll', row.id);

      if (!logs.length) {
        auditContent.innerHTML = `<div class="empty-state"><p>No audit history for this record.</p></div>`;
        return;
      }

      auditContent.innerHTML = logs.map(l => `
        <div class="audit-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
            <span style="font-weight:600;font-size:var(--text-sm);">${l.action} by ${escHtml(l.changed_by)}</span>
            <span class="caption">${new Date(l.created_at).toLocaleString('en-IN')}</span>
          </div>
          <div style="font-size:var(--text-xs);color:var(--text-secondary);font-style:italic;">"${escHtml(l.reason)}"</div>
        </div>`).join('');
    }

    window.exportCSV = function() {
      const rows = [['Employee ID','Name','Department','Basic','Gross','Deductions','Net Salary']];
      currentPayroll.forEach(p => {
        const emp = allEmployees.find(e => e.employee_id === p.employee_id) || {};
        rows.push([p.employee_id, emp.name||'', emp.department||'', p.base_salary, p.gross_salary, p.total_deductions, p.net_salary]);
      });

      const csvContent = 'data:text/csv;charset=utf-8,' + rows.map(r => r.join(',')).join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `Dayflow_Payroll_${new Date().toISOString().slice(0,7)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    init().catch(err => showToast('Error: ' + err.message, 'error'));
  </script>
</body>
</html>
