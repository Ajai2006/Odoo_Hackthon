<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Dayflow HRMS</title>
  <meta name="description" content="Admin dashboard — employee overview, attendance analytics, pending approvals, and HR activity feed.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./components/ui/design-tokens.css">
  <link rel="stylesheet" href="./components/ui/globals.css">
  <link rel="stylesheet" href="./components/ui/sidebar.css">
  <link rel="stylesheet" href="./components/ui/components.css">
  <style>
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: var(--space-8);
      padding-bottom: var(--space-6);
      border-bottom: 1px solid var(--border);
    }
    .topbar h1 { font-size: var(--text-2xl); }
    .topbar p  { color: var(--text-secondary); font-size: var(--text-sm); margin-top: 2px; }
    .topbar-actions { display: flex; align-items: center; gap: var(--space-3); }

    /* Attendance breakdown cards */
    .att-breakdown {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: var(--space-3);
      margin-bottom: var(--space-6);
    }
    .att-box {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-card);
      padding: var(--space-4); text-align: center; transition: transform var(--transition-normal);
    }
    .att-box:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .att-box-num  { font-size: var(--text-3xl); font-weight: var(--fw-extrabold); line-height: 1; margin-bottom: var(--space-2); font-variant-numeric: tabular-nums; }
    .att-box-label{ font-size: var(--text-xs); font-weight: var(--fw-semibold); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; }

    /* Activity feed */
    .activity-feed { display: flex; flex-direction: column; }
    .activity-item { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-4) 0; border-bottom: 1px solid var(--border); }
    .activity-item:last-child { border-bottom: none; }
    .activity-dot { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .activity-dot svg { width: 16px; height: 16px; }
    .activity-dot.success { background: var(--success-bg); color: var(--success); }
    .activity-dot.warning { background: var(--warning-bg); color: var(--warning); }
    .activity-dot.info    { background: var(--info-bg);    color: var(--info);    }
    .activity-dot.danger  { background: var(--danger-bg);  color: var(--danger);  }
    .activity-content { flex: 1; }
    .activity-title { font-size: var(--text-sm); font-weight: var(--fw-medium); color: var(--text-primary); }
    .activity-meta  { font-size: var(--text-xs); color: var(--text-secondary); margin-top: 2px; display: flex; align-items: center; gap: var(--space-2); }

    /* Quick actions */
    .quick-actions { display: grid; grid-template-columns: repeat(3,1fr); gap: var(--space-3); margin-bottom: var(--space-6); }
    .quick-action-btn {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-card);
      padding: var(--space-4); cursor: pointer; transition: all var(--transition-normal);
      display: flex; align-items: center; gap: var(--space-3); text-decoration: none; color: var(--text-primary);
    }
    .quick-action-btn:hover { background: var(--primary-50); border-color: var(--primary-300); transform: translateY(-1px); box-shadow: var(--shadow-md); text-decoration: none; }
    .quick-action-icon { width: 40px; height: 40px; border-radius: var(--radius-input); display: flex; align-items: center; justify-content: center; }
    .quick-action-icon svg { width: 20px; height: 20px; }

    @media (max-width: 1024px) {
      .att-breakdown { grid-template-columns: repeat(2,1fr); }
      .quick-actions { grid-template-columns: repeat(2,1fr); }
    }
    @media (max-width: 640px) {
      .att-breakdown { grid-template-columns: 1fr 1fr; }
      .quick-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>

    <main class="main-content" id="main-content">
      <div class="topbar">
        <div>
          <h1>Admin Dashboard</h1>
          <p id="topbar-date">Loading...</p>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-secondary btn-sm" onclick="loadDashboard()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Refresh
          </button>
          <a href="admin-payroll.html" class="btn btn-primary btn-sm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            Payroll
          </a>
        </div>
      </div>

      <!-- Stat Cards Row -->
      <div class="grid-cols-4" id="stat-cards" style="margin-bottom:var(--space-6);">
        <!-- Injected -->
      </div>

      <!-- Attendance Breakdown -->
      <div class="card" style="margin-bottom:var(--space-6);">
        <div class="card-header">
          <h3 class="card-title">Today's Attendance Breakdown</h3>
          <a href="attendance.html" class="btn btn-ghost btn-sm">Full Report →</a>
        </div>
        <div class="att-breakdown" id="att-breakdown">
          <!-- Injected -->
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="card" style="margin-bottom:var(--space-6);">
        <div class="card-header"><h3 class="card-title">Quick Actions</h3></div>
        <div class="quick-actions">
          <a href="admin-payroll.html" class="quick-action-btn">
            <div class="quick-action-icon" style="background:var(--primary-50);color:var(--primary-600);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            </div>
            <div><div style="font-weight:var(--fw-semibold);font-size:var(--text-sm);">Process Payroll</div><div class="caption">Manage salary records</div></div>
          </a>
          <a href="leave-admin.html" class="quick-action-btn">
            <div class="quick-action-icon" style="background:var(--warning-bg);color:var(--warning);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </div>
            <div>
              <div style="font-weight:var(--fw-semibold);font-size:var(--text-sm);">Review Leaves <span id="pending-badge" class="nav-badge" style="position:static;margin-left:4px;"></span></div>
              <div class="caption">Approve or reject requests</div>
            </div>
          </a>
          <a href="employees.html" class="quick-action-btn">
            <div class="quick-action-icon" style="background:var(--info-bg);color:var(--info);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <div><div style="font-weight:var(--fw-semibold);font-size:var(--text-sm);">Manage Employees</div><div class="caption">View all staff records</div></div>
          </a>
        </div>
      </div>

      <!-- Employee DataTable + Activity Feed -->
      <div style="display:grid;grid-template-columns:3fr 2fr;gap:var(--space-6);">
        <!-- Employee table -->
        <div>
          <div style="margin-bottom:var(--space-4);display:flex;align-items:center;justify-content:space-between;">
            <h3>All Employees</h3>
            <a href="employees.html" class="btn btn-secondary btn-sm">View all →</a>
          </div>
          <div id="employee-table-mount"></div>
        </div>

        <!-- HR Activity Feed -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">HR Activity</h3>
          </div>
          <div class="activity-feed" id="activity-feed">
            <div class="skeleton" style="height:56px;margin-bottom:var(--space-3);border-radius:var(--radius-input);"></div>
            <div class="skeleton" style="height:56px;margin-bottom:var(--space-3);border-radius:var(--radius-input);"></div>
            <div class="skeleton" style="height:56px;border-radius:var(--radius-input);"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container"></div>

  <script type="module">
    import { Sidebar, StatCard, StatusBadge, DataTable, showToast, Icons, fmtCurrency, el } from './components/ui/index.js';
    import { DayflowAuth, DayflowDB } from './components/ui/index.js';

    const user = DayflowAuth.requireRole('admin');
    if (!user) throw new Error('Admin only');

    const now = new Date();
    document.getElementById('topbar-date').textContent = now.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    Sidebar({ role: 'admin', activeKey: 'admin-dashboard', user: { name: user.name } });
    document.querySelector('.main-content').style.marginLeft = 'var(--sidebar-width)';

    async function loadDashboard() {
      await DayflowDB.init();

      const [employees, allPayroll, todayAtt, allLeave, auditLog] = await Promise.all([
        DayflowDB.getEmployees(),
        DayflowDB.getAllPayroll(),
        DayflowDB.getAllTodayAttendance(),
        DayflowDB.getAllLeaveRequests(),
        DayflowDB.getAuditLog(),
      ]);

      const activeEmps    = employees.filter(e => e.status === 'active').length;
      const presentToday  = todayAtt.filter(a => a.status === 'present').length;
      const lateToday     = todayAtt.filter(a => a.status === 'late').length;
      const absentToday   = employees.length - todayAtt.length;
      const onLeaveToday  = todayAtt.filter(a => a.status === 'on-leave').length;
      const pendingLeaves = allLeave.filter(l => l.status === 'pending').length;

      // Stat Cards
      const statEl = document.getElementById('stat-cards');
      statEl.innerHTML = '';
      [
        { title: 'Total Employees', value: employees.length,  icon: 'users',      color: 'primary', trend: { value: `${activeEmps} active`, direction: 'up' } },
        { title: 'Present Today',   value: presentToday + lateToday, icon: 'attendance', color: 'success', subtitle: `${lateToday} late` },
        { title: 'Absent Today',    value: absentToday,       icon: 'x',          color: 'danger',  subtitle: `${onLeaveToday} on leave` },
        { title: 'Pending Approvals',value: pendingLeaves,    icon: 'leave',      color: pendingLeaves > 0 ? 'warning' : 'success', subtitle: 'Leave requests' },
      ].forEach((s, i) => {
        const card = StatCard(s);
        card.style.animationDelay = `${i * 0.08}s`;
        statEl.appendChild(card);
      });

      // Attendance breakdown
      const breakdown = document.getElementById('att-breakdown');
      [
        { label: 'Present', num: presentToday, color: 'var(--success)' },
        { label: 'Late',    num: lateToday,    color: 'var(--warning)' },
        { label: 'Absent',  num: absentToday,  color: 'var(--danger)'  },
        { label: 'On Leave',num: onLeaveToday, color: 'var(--info)'    },
      ].forEach(b => {
        const box = document.createElement('div');
        box.className = 'att-box';
        box.innerHTML = `<div class="att-box-num" style="color:${b.color};">${b.num}</div><div class="att-box-label">${b.label}</div>`;
        breakdown.appendChild(box);
      });

      // Pending badge
      if (pendingLeaves > 0) {
        const pb = document.getElementById('pending-badge');
        if (pb) pb.textContent = pendingLeaves;
      }

      // Employee DataTable
      const tableMount = document.getElementById('employee-table-mount');
      tableMount.innerHTML = '';

      const empData = await Promise.all(employees.map(async emp => {
        const att = todayAtt.find(a => a.employee_id === emp.employee_id);
        return {
          ...emp,
          today_status: att?.status || 'absent',
          avatar: emp.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()
        };
      }));

      const table = DataTable({
        columns: [
          {
            key: 'name', label: 'Employee', sortable: true,
            render: (val, row) => {
              const wrap = document.createElement('div');
              wrap.style.cssText = 'display:flex;align-items:center;gap:10px;';
              wrap.innerHTML = `<div class="avatar" style="width:32px;height:32px;font-size:11px;">${row.avatar}</div>
                <div><div style="font-weight:600;font-size:var(--text-sm);">${val}</div><div style="font-size:var(--text-xs);color:var(--text-secondary);">${row.employee_id}</div></div>`;
              return wrap;
            }
          },
          { key: 'department', label: 'Department', sortable: true },
          {
            key: 'status', label: 'Status', sortable: true,
            render: (val) => StatusBadge({ status: val })
          },
          {
            key: 'today_status', label: "Today",
            render: (val) => StatusBadge({ status: val, size: 'sm' })
          },
        ],
        data: empData,
        pageSize: 6,
        onRowClick: (row) => { window.location.href = `employees.html#${row.employee_id}`; },
        actions: (row) => {
          const editBtn = el('button', { class: 'btn btn-ghost btn-sm btn-icon', title: 'Edit payroll' });
          editBtn.innerHTML = Icons.edit;
          editBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            window.location.href = `admin-payroll.html#${row.employee_id}`;
          });
          return [editBtn];
        }
      });

      tableMount.appendChild(table.element);

      // HR Activity Feed
      const activities = [
        ...allLeave.sort((a,b)=>new Date(b.applied_at)-new Date(a.applied_at)).slice(0,3).map(l => ({
          title: `${l.employee_id}: ${l.type} request ${l.status}`,
          meta: new Date(l.applied_at).toLocaleDateString('en-IN', { day:'2-digit', month:'short' }),
          type: l.status === 'approved' ? 'success' : l.status === 'rejected' ? 'danger' : 'warning',
          icon: 'leave'
        })),
        ...auditLog.slice(0,3).map(a => ({
          title: `Payroll #${a.entity_id} updated — ${a.reason}`,
          meta: new Date(a.created_at).toLocaleDateString('en-IN', { day:'2-digit', month:'short' }),
          type: 'info', icon: 'payroll'
        })),
      ].slice(0, 8);

      const feed = document.getElementById('activity-feed');
      feed.innerHTML = activities.length ? activities.map(a => `
        <div class="activity-item animate-fadeIn">
          <div class="activity-dot ${a.type}">${Icons[a.icon] || Icons.activity}</div>
          <div class="activity-content">
            <div class="activity-title">${a.title}</div>
            <div class="activity-meta">${a.meta}</div>
          </div>
        </div>`).join('') :
        `<div class="empty-state" style="padding:var(--space-8);"><p>No recent activity</p></div>`;
    }

    window.loadDashboard = loadDashboard;
    loadDashboard().catch(err => showToast('Error: ' + err.message, 'error'));
  </script>
</body>
</html>
