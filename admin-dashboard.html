<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Dayflow HRMS</title>
  <meta name="description" content="Dayflow HRMS Admin Dashboard — org-wide overview, employee list, leave queue, and compliance metrics.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./components/ui/design-tokens.css">
  <link rel="stylesheet" href="./components/ui/globals.css">
  <link rel="stylesheet" href="./components/ui/sidebar.css">
  <link rel="stylesheet" href="./components/ui/components.css">
  <style>
    /* View mode toggle */
    .view-toggle-group {
      display: inline-flex;
      background: var(--bg-muted);
      border-radius: var(--radius-btn);
      padding: 2px;
      border: 1px solid var(--border);
    }
    .view-toggle-btn {
      padding: var(--space-1) var(--space-3);
      border-radius: 4px;
      font-size: var(--text-xs);
      font-weight: var(--fw-semibold);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all var(--transition-fast);
    }
    .view-toggle-btn.active {
      background: var(--bg-surface);
      color: var(--primary-900);
      box-shadow: var(--shadow-xs);
    }

    /* Pending Approval Item */
    .approval-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border);
    }
    .approval-item:last-child { border-bottom: none; }
    .approval-info { display: flex; align-items: center; gap: var(--space-3); }
    .approval-actions { display: flex; gap: var(--space-2); }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>

    <main class="main-content" id="main-content">
      <!-- Topbar Header -->
      <div id="topbar-mount"></div>

      <!-- 4-Up StatCard Grid -->
      <div class="grid-cols-4" id="stat-cards" style="margin-bottom:var(--space-6);">
        <!-- Injected by JS -->
      </div>

      <!-- Middle Row: Employee List (DataTable with View Toggle) + Pending Leave Widget -->
      <div style="display:grid;grid-template-columns:3fr 2fr;gap:var(--space-6);margin-bottom:var(--space-6);">
        <!-- Employee List Card -->
        <div class="card card-flat" style="border:1px solid var(--border);padding:var(--space-6);">
          <div class="card-header" style="margin-bottom:var(--space-4);">
            <div>
              <h3 class="card-title">Employee Directory</h3>
              <p class="caption">Active staff members across departments</p>
            </div>
            <div style="display:flex;align-items:center;gap:var(--space-3);">
              <div class="view-toggle-group">
                <button class="view-toggle-btn active" id="view-table-btn" onclick="setViewMode('table')">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                  Table
                </button>
                <button class="view-toggle-btn" id="view-grid-btn" onclick="setViewMode('grid')">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                  Grid
                </button>
              </div>
              <a href="employees.html" class="btn btn-ghost btn-sm">Manage →</a>
            </div>
          </div>

          <div id="employee-view-mount"></div>
        </div>

        <!-- Pending Leave Approvals Widget -->
        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="card-title">Pending Approvals</h3>
              <p class="caption">Requests requiring your action</p>
            </div>
            <a href="leave-admin.html" class="btn btn-ghost btn-sm">View All →</a>
          </div>
          <div id="pending-approvals-mount">
            <div class="skeleton" style="height:60px;margin-bottom:12px;"></div>
            <div class="skeleton" style="height:60px;"></div>
          </div>
        </div>
      </div>

      <!-- Lower Row: HR Org Activity Feed -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Org Activity & Audit Log</h3>
        </div>
        <div class="timeline-feed" id="hr-timeline-feed">
          <div class="skeleton" style="height:48px;margin-bottom:12px;"></div>
          <div class="skeleton" style="height:48px;"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container"></div>

  <script type="module">
    import { Sidebar, TopBar, StatCard, StatusBadge, DataTable, showToast, Icons, fmtCurrency, el, escHtml } from './components/ui/index.js';
    import { DayflowAuth, DayflowDB } from './components/ui/index.js';

    // Auth Guard
    const user = DayflowAuth.requireRole('admin');
    if (!user) throw new Error('Admin role required');

    // Sidebar
    Sidebar({ role: 'admin', activeKey: 'admin-dashboard', user: { name: user.name } });
    document.querySelector('.main-content').style.marginLeft = 'var(--sidebar-width)';

    // TopBar Header
    const now = new Date();
    const formattedDate = now.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const topbar = TopBar({
      title: 'Admin Overview',
      subtitle: `${formattedDate} · HR Operations`,
      user: { name: user.name, role: 'admin' },
      searchPlaceholder: 'Search employees, departments, payroll...'
    });
    document.getElementById('topbar-mount').appendChild(topbar);

    let viewMode = 'table';
    let cachedEmployees = [];
    let cachedTodayAtt = [];

    window.setViewMode = function(mode) {
      viewMode = mode;
      document.getElementById('view-table-btn').classList.toggle('active', mode === 'table');
      document.getElementById('view-grid-btn').classList.toggle('active', mode === 'grid');
      renderEmployeeView();
    };

    async function loadDashboard() {
      await DayflowDB.init();

      const [employees, todayAtt, leaveRequests, auditLogs] = await Promise.all([
        DayflowDB.getEmployees(),
        DayflowDB.getAllTodayAttendance(),
        DayflowDB.getAllLeaveRequests(),
        DayflowDB.getAuditLog()
      ]);

      cachedEmployees = employees;
      cachedTodayAtt  = todayAtt;

      const activeCount    = employees.filter(e => e.status === 'active').length;
      const presentCount   = todayAtt.filter(a => a.status === 'present' || a.status === 'late').length;
      const pendingLeaves  = leaveRequests.filter(l => l.status === 'pending');
      const docsExpiringCount = 3; // Compliance / document metric per spec

      // 4-Up StatCard Grid
      // Amber/Red used ONLY for things that genuinely need attention per spec!
      const statContainer = document.getElementById('stat-cards');
      statContainer.innerHTML = '';

      const stats = [
        { title: 'Total Employees',  value: employees.length,     icon: 'users',      color: 'primary', subtitle: `${activeCount} active staff` },
        { title: 'Present Today',    value: presentCount,         icon: 'attendance', color: 'success', subtitle: `${employees.length - presentCount} absent / off` },
        { title: 'Pending Approvals',value: pendingLeaves.length, icon: 'leave',      color: pendingLeaves.length > 0 ? 'warning' : 'success', subtitle: 'Action required' },
        { title: 'Docs Expiring',    value: docsExpiringCount,    icon: 'alert',      color: 'danger',  subtitle: 'Compliance review' },
      ];

      stats.forEach((s, i) => {
        const card = StatCard(s);
        card.style.animationDelay = `${i * 0.06}s`;
        statContainer.appendChild(card);
      });

      // Employee View
      renderEmployeeView();

      // Pending Approvals Widget
      const appMount = document.getElementById('pending-approvals-mount');
      appMount.innerHTML = '';

      if (!pendingLeaves.length) {
        appMount.innerHTML = `<div class="empty-state" style="padding:var(--space-6);"><p>No pending leave requests 🎉</p></div>`;
      } else {
        pendingLeaves.slice(0, 4).forEach(req => {
          const emp = employees.find(e => e.employee_id === req.employee_id) || {};
          const item = el('div', { class: 'approval-item animate-fadeIn' });
          const initials = (emp.name || req.employee_id).split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();

          item.innerHTML = `
            <div class="approval-info">
              <div class="avatar" style="width:36px;height:36px;font-size:11px;">${initials}</div>
              <div>
                <div style="font-weight:600;font-size:var(--text-sm);">${escHtml(emp.name || req.employee_id)}</div>
                <div class="caption">${escHtml(req.type)} · ${new Date(req.start_date).toLocaleDateString('en-IN', {day:'2-digit',month:'short'})}</div>
              </div>
            </div>`;

          const actionsDiv = el('div', { class: 'approval-actions' });
          const appBtn = el('button', { class: 'btn btn-secondary btn-sm', style: 'color:var(--success);border-color:var(--success-bg);' }, Icons.check);
          appBtn.addEventListener('click', async () => {
            await DayflowDB.saveLeaveRequest({ ...req, status: 'approved' });
            showToast(`Approved leave for ${emp.name}`, 'success');
            await loadDashboard();
          });

          const rejBtn = el('button', { class: 'btn btn-secondary btn-sm', style: 'color:var(--danger);border-color:var(--danger-bg);' }, Icons.x);
          rejBtn.addEventListener('click', async () => {
            await DayflowDB.saveLeaveRequest({ ...req, status: 'rejected' });
            showToast(`Rejected leave for ${emp.name}`, 'warning');
            await loadDashboard();
          });

          actionsDiv.append(appBtn, rejBtn);
          item.appendChild(actionsDiv);
          appMount.appendChild(item);
        });
      }

      // HR Activity & Audit Feed
      const activities = [
        ...leaveRequests.sort((a,b)=>new Date(b.applied_at)-new Date(a.applied_at)).slice(0,3).map(l => {
          const emp = employees.find(e=>e.employee_id===l.employee_id);
          return {
            title: `${emp?.name || l.employee_id} submitted ${l.type} (${l.status})`,
            time: new Date(l.applied_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }),
            type: l.status === 'approved' ? 'success' : l.status === 'rejected' ? 'danger' : 'warning',
            icon: 'leave'
          };
        }),
        ...auditLogs.slice(0, 3).map(log => ({
          title: `Payroll change: ${log.reason || 'Salary updated'}`,
          time: new Date(log.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }),
          type: 'info',
          icon: 'payroll'
        }))
      ].slice(0, 5);

      const timelineMount = document.getElementById('hr-timeline-feed');
      timelineMount.innerHTML = activities.map(a => `
        <div class="timeline-item">
          <div class="timeline-icon ${a.type}">${Icons[a.icon] || Icons.activity}</div>
          <div class="timeline-title">${a.title}</div>
          <div class="timeline-time">${a.time}</div>
        </div>`).join('');
    }

    function renderEmployeeView() {
      const mount = document.getElementById('employee-view-mount');
      mount.innerHTML = '';

      const empData = cachedEmployees.map(emp => {
        const att = cachedTodayAtt.find(a => a.employee_id === emp.employee_id);
        return {
          ...emp,
          today_status: att?.status || 'absent',
          avatar: emp.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()
        };
      });

      if (viewMode === 'table') {
        const table = DataTable({
          columns: [
            {
              key: 'name', label: 'Employee', sortable: true,
              render: (val, row) => {
                const wrap = document.createElement('div');
                wrap.style.cssText = 'display:flex;align-items:center;gap:10px;';
                wrap.innerHTML = `<div class="avatar" style="width:32px;height:32px;font-size:11px;">${row.avatar}</div>
                  <div><div style="font-weight:600;font-size:var(--text-sm);">${val}</div><div style="font-size:var(--text-xs);color:var(--text-secondary);">${row.employee_id}</div></div>`;
                return wrap;
              }
            },
            { key: 'department', label: 'Department', sortable: true },
            { key: 'designation', label: 'Designation' },
            { key: 'status', label: 'Status', render: (val) => StatusBadge({ status: val }) },
            { key: 'today_status', label: "Today", render: (val) => StatusBadge({ status: val, size: 'sm' }) },
          ],
          data: empData,
          pageSize: 5,
          onRowClick: (row) => window.location.href = `employees.html#${row.employee_id}`
        });
        mount.appendChild(table.element);
      } else {
        // Grid Card View
        const grid = el('div', { class: 'data-card-grid' });
        empData.forEach(emp => {
          const card = el('div', { class: 'data-grid-card', onclick: () => window.location.href = `employees.html#${emp.employee_id}` });
          card.innerHTML = `
            <div style="display:flex;align-items:center;gap:var(--space-3);">
              <div class="avatar">${emp.avatar}</div>
              <div>
                <div style="font-weight:600;font-size:var(--text-sm);">${escHtml(emp.name)}</div>
                <div class="caption">${escHtml(emp.designation)}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:var(--space-2);">
              <span class="caption">${escHtml(emp.department)}</span>
              ${StatusBadge({ status: emp.status, size: 'sm' }).outerHTML}
            </div>`;
          grid.appendChild(card);
        });
        mount.appendChild(grid);
      }
    }

    loadDashboard().catch(err => showToast('Error: ' + err.message, 'error'));
  </script>
</body>
</html>
